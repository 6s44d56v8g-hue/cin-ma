<style>

body{margin:0;background:var(--bg);color:var(--ink2);font:400 14px/1.33 var(--f);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}

.bar button.on,.bar button:active,.bar button:focus,nav button:active,nav button:focus{font-weight:400}
.wrap{width:min(1280px,100% - 48px);margin:0 auto;padding:57px 0 40px}

nav button,h1,.sec,.chip>span,.bar button,.y span,.nm,.dr,.sb,.btn{text-box:trim-both cap alphabetic}
nav{display:flex;gap:65px;margin-left:3px}
nav button{background:none;border:0;padding:0;font:400 14px/1.33 var(--f);color:var(--ink2);cursor:pointer}

.top{margin-left:3px}

.x{width:22px;height:22px;padding:0;border:0;background:none;cursor:pointer;display:block;flex:none}
.x svg{display:block}.x circle{fill:#fff}.x path{stroke:var(--ink)}
.x:hover circle{fill:var(--ink)}.x:hover path{stroke:#fff}
.bars{display:flex;gap:20px;flex-wrap:wrap;margin:20px 0 0 3px}
.bar{display:flex;gap:10px;padding:10px;background:#fff}

.rc{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff;padding:14px 14px 14px 20px;margin:10px 0 0 3px;max-width:640px}

.dg{font-size:13px;line-height:1.4;margin-top:10px}

.mrow{display:flex;gap:16px;margin-top:13px;flex-wrap:wrap}
.mp{position:relative;width:80px;height:119px;padding:0;border:0;background:#e3ebeb;overflow:hidden;cursor:pointer;display:block}
.mp img{width:100%;height:100%;object-fit:cover;display:block}
.mp .ph{padding:6px}.mp .ph span{font-size:10px;line-height:1.2}
.mpw{position:relative;width:80px;height:119px}
.mpx{position:absolute;top:6px;right:6px;z-index:2;width:18px;height:18px;filter:drop-shadow(0 0 3px rgba(0,0,0,.22))}
.mpx svg{width:18px;height:18px}
.add{position:relative;width:80px;height:119px;padding:0;border:0;background:none;cursor:pointer;display:grid;place-items:center}
.add svg.d{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible}
.add .pl{position:relative}
#mine+#all .grid,#mine+#all>p{margin-top:40px}
footer{text-align:center;font-size:11px;font-weight:300;opacity:.55;padding:20px}
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <button data-act="tab" data-v="fav">Favoris</button>
    <button data-act="tab" data-v="search">Recherche</button>
    <button data-act="tab" data-v="set">Réglages</button>
  </nav>
  <main id="app"></main>
</div>
<footer id="foot"></footer>

<script>
/* ============ Corner smoothing Figma (squircle) ============
   Géométrie identique à Figma : arrondi continu, "Corner Smoothing" = 100 % (1),
   budget d'arrondi = min(largeur, hauteur) / 2, lissage réduit si la place manque
   (comportement par défaut de Figma). Le tracé est recalculé à chaque
   redimensionnement de l'élément, donc exact à toutes les tailles. */
function sqPath(w, h, radius, smoothing = 1) {
  const budget = Math.min(w, h) / 2;
  const r = Math.min(radius, budget);
  if (r <= 0) return `M0 0H${w}V${h}H0Z`;
  const rad = x => x * Math.PI / 180;
  let s = Math.min(smoothing, budget / r - 1);
  const p = Math.min((1 + smoothing) * r, budget);
  const arcM = 90 * (1 - s);
  const arc = Math.sin(rad(arcM / 2)) * r * Math.SQRT2;
  const alpha = (90 - arcM) / 2;
  const p3p4 = r * Math.tan(rad(alpha / 2));
  const beta = 45 * s;
  const c = p3p4 * Math.cos(rad(beta));
  const d = c * Math.tan(rad(beta));
  const b = (p - arc - c - d) / 3, a = 2 * b;
  const f = n => +n.toFixed(4);
  const A = f(a), B = f(b), C = f(c), D = f(d), AB = f(a + b), ABC = f(a + b + c), BC = f(b + c), L = f(arc), R = f(r);
  return `M${f(w - p)} 0` +
    `c${A} 0 ${AB} 0 ${ABC} ${D}a${R} ${R} 0 0 1 ${L} ${L}c${D} ${C} ${D} ${BC} ${D} ${ABC}` +
    `L${w} ${f(h - p)}` +
    `c0 ${A} 0 ${AB} ${-D} ${ABC}a${R} ${R} 0 0 1 ${-L} ${L}c${-C} ${D} ${-BC} ${D} ${-ABC} ${D}` +
    `L${f(p)} ${h}` +
    `c${-A} 0 ${-AB} 0 ${-ABC} ${-D}a${R} ${R} 0 0 1 ${-L} ${-L}c${-D} ${-C} ${-D} ${-BC} ${-D} ${-ABC}` +
    `L0 ${f(p)}` +
    `c0 ${-A} 0 ${-AB} ${D} ${-ABC}a${R} ${R} 0 0 1 ${L} ${-L}c${C} ${-D} ${BC} ${-D} ${ABC} ${-D}Z`;
}
const sqRO = new ResizeObserver(es => es.forEach(e => sqApply(e.target)));
function sqApply(el) {
  const { width: w, height: h } = el.getBoundingClientRect();
  if (!w || !h) return;
  if (el.dataset.sqd) {   // contour pointillé, trait « inside » de Figma (1 px, tirets 14/14, #343434 à 23 %), même géométrie
    el.querySelector('svg.d').innerHTML = `<path d="${sqPath(w - 1, h - 1, +el.dataset.sqd - 0.5)}" transform="translate(.5 .5)" fill="none" stroke="rgba(52,52,52,.23)" stroke-dasharray="14 14"/>`;
    return;
  }
  el.style.borderRadius = '0';
  el.style.clipPath = `path('${sqPath(w, h, +el.dataset.sq)}')`;
}
function sqScan() {
  document.querySelectorAll('[data-sq]:not([data-o]),[data-sqd]:not([data-o])').forEach(el => { el.dataset.o = 1; sqRO.observe(el); });
}
const SQ = r => `data-sq="${r}" style="border-radius:${r}px"`;   // repli (border-radius) tant que le tracé n'est pas calculé

/* ============ Données ============ */
const DEFAULTS = [
  { q: 'arcades', label: 'Cinéma Les Arcades' },
  { q: 'olympia', label: 'Cinéma Olympia', merge: true },
  { q: 'cineum',  label: 'Cineum Cannes' }
];
const LS = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch { return d; } },
  set(k, v) { localStorage.setItem(k, JSON.stringify(v)); }
};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
/* Icônes exportées telles quelles depuis Figma */
const ICON_X = '<svg class="xi" width="22" height="22" viewBox="0 0 22 22" fill="none"><circle cx="11" cy="11" r="11"/><path d="M7.53613 14.6064L14.6072 7.53538"/><path d="M7.53613 7.53516L14.6072 14.6062"/></svg>';
const ICON_EXT = '<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><rect x="0.5" y="2" width="9" height="9" rx="2.5" stroke="#343434"/><rect x="5" y="0.5" width="6" height="6" fill="#F4F9F9"/><path d="M5 6.5L5.35355 6.85355L11.3536 0.853553L11 0.5L10.6464 0.146446L4.64645 6.14645L5 6.5ZM11.5 0.499999C11.5 0.223857 11.2761 -4.30791e-07 11 -5.57231e-07L6.5 -4.94011e-07C6.22386 -3.25423e-07 6 0.223857 6 0.5C6 0.776142 6.22386 1 6.5 1L10.5 1L10.5 5C10.5 5.27614 10.7239 5.5 11 5.5C11.2761 5.5 11.5 5.27614 11.5 5L11.5 0.499999Z" fill="#343434"/></svg>';

const STAR = '<svg width="33" height="33" viewBox="0 0 33 33" fill="none"><path d="M17.9326 14.0283L18.0449 14.373H23.0449L19.2939 17.0986L19 17.3125L19.1123 17.6582L20.5439 22.0664L16.7939 19.3418L16.5 19.1289L16.2061 19.3418L12.4551 22.0664L13.8877 17.6582L14 17.3125L13.7061 17.0986L9.95508 14.373H14.9551L15.0674 14.0283L16.5 9.61816L17.9326 14.0283Z" stroke="#343434"/></svg>';
const PLUS = '<svg class="pl" width="17" height="17" viewBox="0 0 17 17" fill="none"><path d="M8.03613 16.0713L8.03613 1.27666e-06" stroke="#C8CCCC" stroke-width="2"/><path d="M7.02499e-07 8.03516L16.0713 8.03516" stroke="#C8CCCC" stroke-width="2"/></svg>';
let tmdbKey = LS.get('tmdbKey', ''), proxy = LS.get('proxy', ''), key = LS.get('key', ''),
    favC = LS.get('favC', []), favM = LS.get('favM', []), done = LS.get('done', {});
const migrateFav = f => ({ ...f, k: f.k || (f.tmdb ? 't' + f.tmdb : 'x' + f.title) });
favM = favM.map(migrateFav);
let view = 'fav', notices = [], progs = {}, REL = {}, lastAll = [], lastErrs = [], lastFilms = [],
    flt = { period: 'week', type: 'all' };

async function api(path) {
  if (!key && !proxy) throw new Error('Ajoute le proxy ou ta clé API dans Réglages.');
  let r;
  try {
    r = proxy ? await fetch(proxy.replace(/\/$/, '') + '/v1' + path)
              : await fetch('https://api.api-cinema.com/v1' + path, { headers: { Authorization: 'Bearer ' + key } });
  } catch { throw new Error('Requête bloquée (réseau ou CORS). Voir Réglages.'); }
  const q = r.headers.get('x-weekly-quota-remaining');
  if (q !== null) { LS.set('quota', q); updFoot(); }
  if (r.status === 401 || r.status === 403) throw new Error('Clé refusée par API Cinéma.');
  if (r.status === 429) throw new Error('Quota dépassé : réessaie lundi (00:00 UTC).');
  if (!r.ok) throw new Error('Erreur API ' + r.status);
  return r.json();
}
async function cached(k, hours, fn, force) {
  const c = LS.get(k, null);
  if (c && !force && Date.now() - c.t < hours * 36e5) return c.d;
  const d = await fn();
  try { LS.set(k, { t: Date.now(), d }); } catch { purge(); }
  return d;
}
function purge() { Object.keys(localStorage).filter(k => k.startsWith('c:')).forEach(k => localStorage.removeItem(k)); }
const ymd = d => d.toLocaleDateString('sv');
const slim = s => ({
  t: s.startsAt, v: s.version, f: s.format, b: s.bookingUrl,
  m: { id: s.movie?.id || s.movieId, tmdb: s.movie?.tmdbId ?? null, title: s.movie?.title || '?', year: s.movie?.year,
       dur: s.movie?.durationMin, dir: s.movie?.director, genres: s.movie?.genres || [], poster: s.movie?.posterUrl }
});
async function fetchAll(path) {            // parcourt toutes les pages (limit 1000 + meta.nextCursor)
  const out = []; let cursor = null, pages = 0;
  do {
    const j = await api(path + (cursor ? '&cursor=' + encodeURIComponent(cursor) : ''));
    out.push(...j.data);
    cursor = j.meta?.nextCursor || null;
  } while (cursor && ++pages < 6);
  return out;
}
function loadProg(id, force) {
  const to = new Date(Date.now() + 8 * 864e5);
  return cached('c:q:' + id, 12, async () =>
    (await fetchAll(`/cinemas/${encodeURIComponent(id)}/showtimes?to=${ymd(to)}&include=movie&limit=1000`)).map(slim), force);
}
const loadInfo = id => cached('c:i:' + id, 48, async () => { const j = await api('/cinemas/' + encodeURIComponent(id)); return j.data || j; });

/* TMDB : date de sortie FR + affiche de secours */
async function loadRel(ids) {
  if (!tmdbKey) return;
  await Promise.all(ids.filter(i => !(i in REL)).map(async i => {
    try {
      REL[i] = await cached('c:r:' + i, 720, async () => {
        const r = await fetch(`https://api.themoviedb.org/3/movie/${i}/release_dates?api_key=${encodeURIComponent(tmdbKey)}`);
        if (!r.ok) throw new Error('tmdb');
        const fr = ((await r.json()).results || []).find(x => x.iso_3166_1 === 'FR');
        const by = t => (fr?.release_dates || []).filter(d => d.type === t).map(d => d.release_date.slice(0, 10)).sort()[0];
        return by(3) || by(2) || '';
      });
    } catch {}
  }));
}
const kind = s => { const r = REL[s.m.tmdb]; return r && s.t.slice(0, 10) < r ? 'a' : 'n'; };
/* Affiche manquante : API Cinéma → TMDB (par tmdbId, jamais par titre) → vignette avec le titre */
async function tmdbPoster(id) {
  if (!tmdbKey || !id) return '';
  try {
    const path = await cached('c:t:' + id, 720, async () => {
      const r = await fetch(`https://api.themoviedb.org/3/movie/${id}?api_key=${encodeURIComponent(tmdbKey)}&language=fr-FR`);
      if (!r.ok) throw new Error('tmdb');
      return (await r.json()).poster_path || '';
    });
    return path ? 'https://image.tmdb.org/t/p/w500' + path : '';
  } catch { return ''; }
}
async function fillPosters() {
  const miss = [...new Set(lastAll.filter(s => !s.m.poster && s.m.tmdb).map(s => s.m.tmdb))];
  await Promise.all(miss.map(async id => {
    const u = await tmdbPoster(id);
    if (u) lastAll.forEach(s => { if (s.m.tmdb === id && !s.m.poster) s.m.poster = u; });
  }));
}
async function posterFail(img) {
  const t = img.dataset.tmdb;
  if (!img.dataset.t && t) {
    img.dataset.t = 1;
    const u = await tmdbPoster(t);
    if (u && u !== img.src) { img.src = u; return; }
  }
  img.replaceWith(Object.assign(document.createElement('div'), { className: 'ph', innerHTML: `<span>${esc(img.dataset.title || '')}</span>` }));
}

async function initDefaults() {
  if (!key && !proxy) return;
  for (const t of DEFAULTS) {
    if (done[t.q]) continue;
    try {
      const j = await api(`/cinemas?q=${t.q}&city=Cannes&country=FR`);
      if (j.data.length === 1 || (t.merge && j.data.length > 1 && j.data.every(c => base(c.name).includes(t.q)))) {
        j.data.forEach(c => addFav({ id: c.id, name: c.name, city: c.city }));
        done[t.q] = true;
      } else notices.push(`${t.label} : ${j.data.length ? 'plusieurs résultats' : 'introuvable'} dans API Cinéma, ajoute-le via Recherche.`);
    } catch (e) { notices.push(`${t.label} : ${e.message}`); break; }
  }
  LS.set('favC', favC); LS.set('done', done);
}

/* ============ Affichage ============ */
const short = n => (n.replace(/^cin[ée]ma\s+/i, '').replace(/^les\s+/i, '').replace(/\s+cannes$/i, '').trim() || n);
const idsOf = c => (c.ids && c.ids.length ? c.ids : [c.id]);
const base = n => short(n).toLowerCase().replace(/\s+/g, ' ').trim();
const related = (a, b) => a.city === b.city && (base(a.name).startsWith(base(b.name)) || base(b.name).startsWith(base(a.name)));
const isFav = id => favC.some(c => idsOf(c).includes(id));
function addFav(c) {   // fusionne avec un cinéma déjà favori s'il s'agit du même (ex. « Olympia » et « Olympia 5 à 9 »)
  const ex = favC.find(x => idsOf(x).includes(c.id)) || favC.find(x => related(x, c));
  if (!ex) { favC.push({ id: c.id, ids: [c.id], name: c.name, city: c.city }); return; }
  ex.ids = [...new Set([...idsOf(ex), c.id])];
  if (base(c.name).length < base(ex.name).length) ex.name = c.name;
}
function removeFavId(id) {
  favC.forEach(c => { if (idsOf(c).includes(id)) { c.ids = idsOf(c).filter(i => i !== id); if (c.ids.length) c.id = c.ids[0]; else c.dead = true; } });
  favC = favC.filter(c => !c.dead);
}
(function () {   // regroupe d'éventuels doublons déjà enregistrés + une relecture unique des cinémas par défaut
  const old = favC; favC = [];
  old.forEach(c => idsOf(c).forEach(id => addFav({ id, name: c.name, city: c.city })));
  LS.set('favC', favC);
  if (!LS.get('merge1', false)) { done.olympia = false; LS.set('done', done); LS.set('merge1', true); }
})();
const dedupeSt = a => { const m = new Map(); a.forEach(s => { const k = `${s.m.tmdb || s.m.id}|${s.t}|${s.v}|${s.f}`; if (!m.has(k) || (!m.get(k).b && s.b)) m.set(k, s); }); return [...m.values()]; };
const fk = m => m.tmdb ? 't' + m.tmdb : (m.id ? 'm' + m.id : 'x' + m.title);
const fmtD = d => new Date(d + 'T12:00').toLocaleDateString('fr-FR', { day: 'numeric', month: 'long' });
const dayLab = d => new Date(d + 'T12:00').toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
const errBox = m => `<div class="err" ${SQ(10)}>${esc(m)}</div>`;
function range(p) {
  const n = new Date(), d = new Date(n.getFullYear(), n.getMonth(), n.getDate()), w = d.getDay();
  const add = k => { const x = new Date(d); x.setDate(x.getDate() + k); return ymd(x); };
  if (p === 'week') return { start: ymd(d), end: add(7) };
  if (w === 5) return { start: ymd(d), end: add(2) };
  if (w === 6) return { start: ymd(d), end: add(1) };
  if (w === 0) return { start: ymd(d), end: ymd(d) };
  return { start: add(5 - w), end: add(7 - w) };
}
function updFoot() {
  const q = LS.get('quota', null);
  $('#foot').textContent = q !== null ? `Requêtes restantes cette semaine : ${q}` : '';
}
function post() {
  sqScan();
  requestAnimationFrame(() => document.querySelectorAll('.nm').forEach(el => {
    el.classList.remove('sm');
    if (el.scrollWidth > el.clientWidth + 1) el.classList.add('sm');
  }));
}
document.fonts?.ready.then(post);
function setView(v) { view = v; ({ fav: renderFav, search: renderSearch, set: renderSet })[v](); post(); }

const posterHtml = (m, withStar = true) => {
  const k = fk(m), on = favM.some(x => x.k === k);
  return `<div class="poster" ${SQ(18)}>${m.poster
    ? `<img src="${esc(m.poster)}" alt="" loading="lazy" referrerpolicy="no-referrer" data-tmdb="${m.tmdb || ''}" data-title="${esc(m.title)}" onerror="posterFail(this)">`
    : `<div class="ph"><span>${esc(m.title)}</span></div>`}
    ${withStar ? `<button ${SQ(9)} class="st ${on ? 'on' : ''}" title="Film favori" data-act="fm" data-k="${esc(k)}" data-tmdb="${m.tmdb || ''}" data-id="${esc(m.id || '')}" data-title="${esc(m.title)}" data-poster="${esc(m.poster || '')}">${STAR}</button>` : ''}</div>`;
};
const lbLink = m => m.tmdb ? `<a href="https://letterboxd.com/tmdb/${m.tmdb}" target="_blank" rel="noopener" title="Letterboxd">${ICON_EXT}</a>` : '';

function barsHtml() {
  const g = (k, items) => `<div class="bar" ${SQ(18)}>${items.map(([v, l]) => `<button ${SQ(10)} class="${flt[k] === v ? 'on' : ''}" data-act="flt" data-k="${k}" data-v="${v}">${l}</button>`).join('')}</div>`;
  return g('period', [['week', 'Cette semaine'], ['wk', 'Ce week-end']]) +
         g('type', [['all', 'Tout'], ['n', 'Séances normales'], ['a', 'Avant-premières'], ['p', 'Prochainement']]);
}
function renderFav() {
  $('#app').innerHTML = `
    <h1>Séances</h1>
    <div class="chips top">${favC.map(c => `<span class="chip" ${SQ(51)}><span>${esc(short(c.name))}</span><button class="x" data-act="rm" data-id="${esc(c.id)}" title="Retirer">${ICON_X}</button></span>`).join('') || '<span class="mut">Aucun cinéma favori. Utilise Recherche pour en ajouter.</span>'}</div>
    <div class="bars" id="bars">${barsHtml()}</div>
    <div class="mine" id="mine"></div>
    <div id="all"></div>`;
  updFilms();
  loadAll();
}
async function loadAll() {
  const el = $('#all');
  if (!favC.length) { el.innerHTML = ''; return; }
  const res = await Promise.allSettled(favC.map(c => Promise.all(idsOf(c).map(i => loadProg(i))).then(a => dedupeSt(a.flat()))));
  const errs = [];
  res.forEach((r, i) => { if (r.status === 'fulfilled') progs[favC[i].id] = r.value; else errs.push(`${short(favC[i].name)} : ${r.reason.message}`); });
  const infos = await Promise.allSettled(favC.flatMap(c => idsOf(c).map(i => loadInfo(i).then(v => ({ c, v })))));
  infos.forEach(r => {
    if (r.status !== 'fulfilled') return;
    const { c, v } = r.value, chk = v.programmeCheckedAt;
    if (!chk || Date.now() - new Date(chk) > 2 * 864e5) errs.push(`${short(c.name)} : programmation possiblement périmée (dernière lecture : ${chk ? chk.slice(0, 10) : 'jamais'}).`);
  });
  lastAll = favC.flatMap(c => (progs[c.id] || []).map(s => ({ ...s, c })));
  lastErrs = [...new Set(errs)];
  await Promise.all([loadRel([...new Set(lastAll.map(s => s.m.tmdb).filter(Boolean))]), fillPosters()]);
  drawAll(); updFilms();
}
function card({ m, s }, withBtn = true) {
  const rel = REL[m.tmdb], today = ymd(new Date());
  const top = rel > today ? (s && s.some(x => x.t.slice(0, 10) < rel) ? 'Avant-première · ' : '') + 'sortie le ' + fmtD(rel) : (m.year || '');
  return `<div class="cd">${posterHtml(m)}
    <div class="info"><div class="tx"><div class="y"><span>${esc(top)}</span>${lbLink(m)}</div>
      <div class="nm">${esc(m.title)}</div>
      <div class="dr">${m.dir ? 'De ' + esc(m.dir) : ''}</div></div>
      ${withBtn ? `<button class="sb" ${SQ(8)} data-act="sc" data-k="${esc(fk(m))}">Séances</button>` : ''}</div></div>`;
}
function drawAll() {
  const el = $('#all'); if (!el) return;
  $('#bars').innerHTML = barsHtml();
  const { start, end } = range(flt.period), today = ymd(new Date()), t = flt.type;
  let q = lastAll.filter(s => { const d = s.t.slice(0, 10); return d >= start && d <= end; });
  if (t === 'n') q = q.filter(s => kind(s) === 'n');
  if (t === 'a') q = q.filter(s => kind(s) === 'a');
  if (t === 'p') q = q.filter(s => REL[s.m.tmdb] > today);
  const g = new Map();
  q.sort((x, y) => x.t.localeCompare(y.t)).forEach(s => { const k = s.m.tmdb || s.m.id; if (!g.has(k)) g.set(k, { m: s.m, s: [] }); g.get(k).s.push(s); });
  lastFilms = [...g.values()];
  if (t === 'p') lastFilms.sort((x, y) => REL[x.m.tmdb].localeCompare(REL[y.m.tmdb]));
  el.innerHTML = lastFilms.length ? `<div class="grid">${lastFilms.map(f => card(f)).join('')}</div>` : `<p class="mut" style="margin-top:58px">Aucun film${lastErrs.length || (!key && !proxy) ? ' à afficher (voir Réglages)' : ''}.</p>`;
  post();
}
function updFilms() {
  const el = $('#mine'); if (!el) return;
  const nowS = ymd(new Date()) + 'T' + new Date().toTimeString().slice(0, 5);
  const items = favM.map(f => {
    const q = lastAll.filter(x => fk(x.m) === f.k && x.t >= nowS).sort((a, b) => a.t.localeCompare(b.t));
    return q.length ? { f, m: q[0].m, next: q[0].t } : null;
  }).filter(Boolean).sort((a, b) => a.next.localeCompare(b.next));
  el.innerHTML = `<h2>Mes prochaines séances</h2><div class="mrow">${items.map(({ f, m }) => {
    const src = m.poster || f.poster;
    return `<div class="mpw"><button class="mp" ${SQ(11)} data-act="sc" data-k="${esc(f.k)}" title="${esc(m.title)}">${src
      ? `<img src="${esc(src)}" alt="" referrerpolicy="no-referrer" data-tmdb="${f.tmdb || ''}" data-title="${esc(m.title)}" onerror="posterFail(this)">`
      : `<div class="ph"><span>${esc(m.title)}</span></div>`}</button>
      <button class="x mpx" data-act="unfav" data-k="${esc(f.k)}" title="Retirer des favoris">${ICON_X}</button></div>`;
  }).join('')}<button class="add" data-act="addfilm" data-sqd="11" title="Ajouter un film"><svg class="d"></svg>${PLUS}</button></div>`;
  post();
}
function openModal(k) {
  const s = lastAll.filter(x => fk(x.m) === k).sort((a, b) => a.t.localeCompare(b.t));
  if (!s.length) return;
  const m = s[0].m, days = [...new Set(s.map(x => x.t.slice(0, 10)))];
  const chip = x => {
    const lab = `${esc(x.t.slice(11, 16))}<small>${esc(x.v === 'UNKNOWN' ? '' : x.v)}${x.f && x.f !== '2D' && x.f !== 'UNKNOWN' ? ' ' + esc(x.f) : ''}</small>`;
    return x.b ? `<a ${SQ(8)} href="${esc(x.b)}" target="_blank" rel="noopener">${lab}</a>` : `<span ${SQ(8)}>${lab}</span>`;
  };
  const o = document.createElement('div');
  o.className = 'ov'; o.dataset.act = 'close';
  o.innerHTML = `<div class="md" ${SQ(18)}><div class="mh"><div><h3>${esc(m.title)}</h3>
    <div class="mut" style="margin:6px 0 0">${[m.year, m.dur && m.dur + ' min', m.dir, (m.genres || []).slice(0, 2).join(', ')].filter(Boolean).map(esc).join(' · ')}</div></div>
    <button class="x" data-act="close" title="Fermer">${ICON_X}</button></div>
    ${days.map(d => `<div class="dy">${esc(dayLab(d))}</div>${[...new Set(s.filter(x => x.t.slice(0, 10) === d).map(x => x.c.id))].map(cid =>
      `<div class="cn">${esc(short(favC.find(c => c.id === cid)?.name || ''))}</div><div class="tm">${s.filter(x => x.t.slice(0, 10) === d && x.c.id === cid).map(chip).join('')}</div>`).join('')}`).join('')}
  </div>`;
  document.body.appendChild(o);
  sqScan();
}

function renderSearch() {
  $('#app').innerHTML = `
    <h1>Recherche</h1>
    <div class="row" style="max-width:640px;margin-top:0">
      <select id="mode" ${SQ(10)}><option value="c">Cinémas</option><option value="f">Films à l’affiche</option></select>
      <input id="q" ${SQ(10)} placeholder="Nom ou code postal">
      <input id="city" ${SQ(10)} placeholder="Ville (cinémas)">
      <button class="btn" ${SQ(10)} data-act="search">Chercher</button>
    </div><div id="res"></div>`;
}
async function doSearch() {
  const mode = $('#mode').value, q = $('#q').value.trim(), city = $('#city').value.trim(), res = $('#res');
  if (!q && !city) return;
  res.innerHTML = '<p class="mut">Recherche…</p>';
  try {
    if (mode === 'c') {
      const p = new URLSearchParams({ country: 'FR', limit: '20' });
      if (/^\d{2,5}$/.test(q)) p.set('zip_code', q); else if (q) p.set('q', q);
      if (city) p.set('city', city);
      const { data } = await api('/cinemas?' + p);
      res.innerHTML = data.length ? data.map(c => `<div class="rc" ${SQ(18)}><div><div>${esc(c.name)}</div><div class="mut" style="margin:2px 0 0">${esc([c.address, c.postalCode, c.city].filter(Boolean).join(' '))}</div></div>
        <button class="btn ${isFav(c.id) ? '' : 'l'}" ${SQ(10)} data-act="tg" data-id="${esc(c.id)}" data-name="${esc(c.name)}" data-city="${esc(c.city)}">${isFav(c.id) ? '★ Favori' : '☆ Ajouter'}</button></div>`).join('') : '<p class="mut">Aucun résultat.</p>';
    } else {
      const { data } = await api('/movies?' + new URLSearchParams({ q, playing: 'true', country: 'FR', limit: '24' }));
      const seen = new Set();
      const list = data.filter(m => { const k = m.tmdbId || m.id; if (seen.has(k)) return false; seen.add(k); return true; });
      res.innerHTML = list.length ? `<div class="grid">${list.map(m => card({ m: { tmdb: m.tmdbId, id: m.id, title: m.title, poster: m.posterUrl, year: m.year, dir: m.director }, s: null }, false)).join('')}</div>` : '<p class="mut">Aucun film.</p>';
    }
  } catch (e) { res.innerHTML = errBox(e.message); }
  post();
}

function diagHtml() {
  if (!favC.length) return '';
  const rows = favC.flatMap(c => idsOf(c).map(id => {
    const p = LS.get('c:q:' + id, null), i = LS.get('c:i:' + id, null);
    const d = p?.d || [], days = d.map(s => s.t.slice(0, 10)).sort();
    const films = new Set(d.map(s => s.m.tmdb || s.m.id)).size;
    const chk = i?.d?.programmeCheckedAt;
    return `<div class="dg"><b>${esc(short(c.name))}</b> <span class="mut" style="margin:0">(${esc(id)})</span><br>${p
      ? `${d.length} séances · ${films} films · du ${esc(days[0]?.slice(5) || '?')} au ${esc(days[days.length - 1]?.slice(5) || '?')} · chargé il y a ${Math.round((Date.now() - p.t) / 36e4) / 10} h`
      : 'pas encore chargé'}${chk ? ` · programme lu par l’API le ${esc(chk.slice(0, 16).replace('T', ' '))} UTC` : ''}</div>`;
  }));
  return `<div class="card" ${SQ(18)}><div>Diagnostic des cinémas</div>
    <p>Ce que l’API a renvoyé pour chaque cinéma. Si une séance manque ici, elle manque dans l’API Cinéma ; si elle est ici mais pas à l’accueil, c’est un filtre.</p>${rows.join('')}
    <div class="row" style="margin:14px 0 0"><button class="btn l" ${SQ(10)} data-act="reload">Recharger maintenant</button></div>
    <p style="margin-top:8px">Coûte au moins une requête par cinéma.</p></div>`;
}
function messages() {
  const m = [];
  if (!key && !proxy) m.push('Ajoute le proxy ou ta clé API Cinéma ci-dessous pour charger les séances.');
  m.push(...notices, ...lastErrs);
  if (!tmdbKey) m.push('Ajoute ta clé TMDB pour distinguer avant-premières et sorties prochaines, et pour les affiches de secours.');
  return m;
}
function renderSet() {
  $('#app').innerHTML = `
    <h1>Réglages</h1>
    ${messages().map(errBox).join('')}
    <div class="card" ${SQ(18)}><div>Proxy (recommandé)</div>
      <p>Adresse de ton Cloudflare Worker (worker.js). Il garde la clé API Cinéma côté serveur.</p>
      <input id="proxy" ${SQ(10)} placeholder="https://xxx.workers.dev" value="${esc(proxy)}" style="width:100%"></div>
    <div class="card" ${SQ(18)}><div>Clé API Cinéma (sans proxy)</div>
      <p>Stockée uniquement dans ce navigateur, jamais dans le fichier.</p>
      <input id="key" ${SQ(10)} type="password" placeholder="ac_live_…" value="${esc(key)}" style="width:100%"></div>
    <div class="card" ${SQ(18)}><div>Clé TMDB (gratuite)</div>
      <p>Date de sortie française des films (avant-premières, sorties prochaines) et affiches de secours.</p>
      <input id="tmdb" ${SQ(10)} type="password" placeholder="Clé API v3" value="${esc(tmdbKey)}" style="width:100%"></div>
    ${diagHtml()}
    <div class="row"><button class="btn" ${SQ(10)} data-act="savekey">Enregistrer</button>
      <button class="btn l" ${SQ(10)} data-act="refresh">Vider le cache</button></div>
    <p class="mut" style="max-width:640px;margin-top:20px">Les programmes sont gardés 12 h en cache pour économiser les 150 requêtes hebdomadaires.</p>`;
}

document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const d = b.dataset;
  if (d.act === 'close') { if (e.target.closest('.md') && !e.target.closest('.x')) return; document.querySelector('.ov')?.remove(); }
  else if (d.act === 'tab') setView(d.v);
  else if (d.act === 'rm') { favC = favC.filter(c => c.id !== d.id); LS.set('favC', favC); lastAll = lastAll.filter(s => s.c.id !== d.id); renderFav(); post(); }
  else if (d.act === 'tg') {
    if (isFav(d.id)) removeFavId(d.id); else addFav({ id: d.id, name: d.name, city: d.city });
    LS.set('favC', favC); const on = isFav(d.id);
    b.textContent = on ? '★ Favori' : '☆ Ajouter'; b.classList.toggle('l', !on);
  }
  else if (d.act === 'flt') { flt[d.k] = d.v; drawAll(); }
  else if (d.act === 'sc') openModal(d.k);
  else if (d.act === 'fm') {
    const k = d.k;
    if (favM.some(f => f.k === k)) favM = favM.filter(f => f.k !== k);
    else favM.push({ k, tmdb: d.tmdb ? +d.tmdb : null, id: d.id || null, title: d.title, poster: d.poster });
    LS.set('favM', favM);
    const on = favM.some(f => f.k === k);
    document.querySelectorAll('.st').forEach(x => { if (x.dataset.k === k) x.classList.toggle('on', on); });
    updFilms();
  }
  else if (d.act === 'unfav') {
    const k = d.k; favM = favM.filter(f => f.k !== k); LS.set('favM', favM);
    document.querySelectorAll('.st').forEach(x => { if (x.dataset.k === k) x.classList.remove('on'); }); updFilms();
  }
  else if (d.act === 'addfilm') { setView('search'); $('#mode').value = 'f'; $('#q').focus(); }
  else if (d.act === 'search') doSearch();
  else if (d.act === 'savekey') {
    key = $('#key').value.trim(); LS.set('key', key);
    proxy = $('#proxy').value.trim(); LS.set('proxy', proxy);
    tmdbKey = $('#tmdb').value.trim(); LS.set('tmdbKey', tmdbKey); REL = {}; notices = [];
    await initDefaults(); if (notices.length) setView('set'); else setView('fav');
  }
  else if (d.act === 'reload') {
    favC.forEach(c => idsOf(c).forEach(id => { localStorage.removeItem('c:q:' + id); localStorage.removeItem('c:i:' + id); }));
    progs = {}; setView('fav');
  }
  else if (d.act === 'refresh') { purge(); progs = {}; REL = {}; setView('fav'); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.querySelector('.ov')?.remove();
  if (e.key === 'Enter' && (e.target.id === 'q' || e.target.id === 'city')) doSearch();
});

(async () => { updFoot(); setView('fav'); await initDefaults(); if (notices.length) renderFav(); post(); })();
</script>
</body>
